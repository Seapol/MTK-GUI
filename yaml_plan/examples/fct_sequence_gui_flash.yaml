fct_sequence:
  name: FRDM-IMXRT700 FCT - GUI flash path
  flash_mode: gui
  keyword_pass:
  - pass
  - passed
  - success
  - succeed
  - ok
  - done
  - complete
  keyword_fail:
  - fail
  - failed
  - failure
  - error
  - timeout
  - abort
  - exception
  - refused
  steps:
  - name: Flash FAT Firmware
    step_type: GUI_CONFIRM
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: operator
    params:
      slot: fat
  - name: Wi-Fi Scan and Connect
    step_type: EXTERNAL_TOOL
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: operator
    params:
      tool_family: wifi
      tool: vendor_rf_tool.exe
      note: operator launches the vendor RF GUI
  - name: All Tests done.
    step_type: MESSAGE_CHECK
    channel: ''
    command: ''
    expect_pass:
    - done
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: ''
    params: {}
  - name: Flash OOBE Firmware
    step_type: GUI_CONFIRM
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: operator
    params:
      slot: oobe
  - name: Power Off DUT
    step_type: GUI_CONFIRM
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: ''
    params:
      op: Power Off DUT
  - name: Fixture Unlock
    step_type: GUI_CONFIRM
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: ''
    params:
      op: Fixture Unlock
  - name: Fixture Release
    step_type: GUI_CONFIRM
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: ''
    params:
      op: Fixture Release
