  u_ai:
    title: U2355A - Analog Inputs
    fields:
      Resource: AI x16 (max)
      Used: 12 critical rails
      Rate: ≈20 kSa/s/ch -> CSV
      Range: ±10 V, 16-bit
      Tap: parallel at power net points
  u_ctr:
    title: U2355A - Counters + DIO
    fields:
      Counters: 'CTR0 / CTR1: 0.1 Hz - 6 MHz'
      CLK2 / CLK3: 4 MHz / 6 MHz
      Digital IO: 24 ch -> DUT GPIO
      Level match: level shifter 1.8 / 3.3 / 5 V
      AO backup: 2 ch ±10 V, 12-bit
  psu:
    title: N5747A DC Power Supply
    fields:
      Model: Keysight N5747A
      Output: 60 V / 12.5 A / 750 W
      Remote sense: 4-wire ±S at the load
      Interfaces: LAN (LXI) + USB + GPIB
      J1: analog program + RI/FLT inhibit
      Status: Available (demo)
  psu_detail:
    title: N5747A - Output & Sense
    fields:
      Output: ±OUT -> VIN+ / VIN−
      Remote sense: ±S -> 4-wire at the load
      Readback: V/I readback ≈1% (trend only)
      J1: analog program + RI/FLT hardware inhibit
      Voltages: 5 / 12 / 24 / 48 V profiles
  fixture:
    title: Fixture Probe Board
    fields:
      Board: Probe board with star ground plane
      Probe pins: 128 pinhole pins
      Power net points: TP_P1 - TP_P80
      Grounding: single-point star plane
      IO board: ATE fixture control board
  control_board:
    title: ATE Fixture Control Board
    fields:
      Board: ATE fixture control board
      Driven by: DAQM907A Port 1/2 open-drain
      Pull-up: external; 42 V / 400 mA
      Channels: 16 (4 used)
  cell_press:
    title: '[OUT] Press Cylinder'
    fields:
      Signal: digital output
      High: press / clamp down
      Low: release
  cell_inpos:
    title: '[IN] Cylinder In-Position'
    fields:
      Signal: digital input
      High: locked
      Low: unlocked
  cell_presence:
    title: '[IN] DUT Presence'
    fields:
      Signal: digital input, active-low
      High: absence
      Low: presence
  cell_estop:
    title: '[IN] E-Stop Healthy'
    fields:
      Signal: digital input, active-low
      High: unhealthy / triggered
      Low: healthy
  dut:
    title: DUT Board
    fields:
      DUT: DUT board via fixture probes
      Probe pads: '>32 mils (typical 40 mils)'
      Power nets: TP_P1 - TP_P80
      GPIO nets: TP_GPIO0 - TP_GPIO23
      Reference: stress / strain gauge
  grp_power:
    title: Power Nets TP_P1-P80
    fields:
      Group: Power nets TP_P1 - TP_P80
      Subset: 12 critical rails for up-sequence
      Tests: 2-wire Ω + DCV via DAQ973A
      Up-sequence: 12 ch via U2355A -> CSV + waveform
      Judgment: ±0.1% via DAQ973A
      Ω threshold: R_min = V_rail / I_allow, 1.5 Ω tol
  grp_clocks:
    title: Clock Nets
    fields:
      CLK1: 32.768 kHz -> 907A totalizer
      CLK2: 4 MHz -> U2355A CTR0
      CLK3: 6 MHz -> U2355A CTR1
  grp_adc:
    title: ADC Input
    fields:
      Inputs: TP_ADC0 / TP_ADC1
      Stimulus: 907A AO0 / AO1, ±12 V 16-bit
      Test: DUT ADC readback
  grp_vin:
    title: Main Power Input
    fields:
      Inputs: VIN+ / VIN−
      Voltages: 5 / 12 / 24 / 48 V
      Sense: 4-wire remote at the load
  grp_gnd:
    title: GND Probes
    fields:
      Probes: GND x2
      Connection: -> star ground plane
  grp_gpio:
    title: GPIO Nets
    fields:
      Nets: TP_GPIO0 - TP_GPIO23 (24 ch)
      Driven by: U2355A DIO via level shifter
      Tests: drive HI/LO, read back, toggle
console: []
test_workflow:
  overall_flow:
  - stage: ICT
    description: 'In-Circuit Test: 80 power nets impedance -> voltage -> RTC/CLKOUT1/CLKOUT2 clocks'
    enable: true
  - stage: FCT
    description: 'Functional Test: LED -> Serial Console (Linux) -> Wi-Fi -> Bluetooth -> Flash FAT -> Flash OOBE'
    enable: true
  stop_if_failure: false
  stop_if_any_short: true
  ict_test_cases:
  - name: Init Instruments
    kind: op
    enable: true
    wait_ms: 0
    timeout_ms: 5000
    unit: —
    threshold_min: —
    threshold_max: —
    op_params:
      type: instruments
      instruments:
      - DAQM
      - DAQ
      - PSU
  - name: Fixture Clamp Down
    kind: op
    enable: true
    wait_ms: 1000
    timeout_ms: 5000
    unit: —
    threshold_min: —
    threshold_max: —
    op_params:
      type: fixture
      signal: press
      level: H
  - name: Fixture Lock
    kind: op
    enable: true
    wait_ms: 1000
    timeout_ms: 5000
    unit: —
    threshold_min: —
    threshold_max: —
    op_params:
      type: fixture
      signal: inpos
      level: H
  - name: Fixture E-Stop Healthy
    kind: op
    enable: true
    wait_ms: 1000
    timeout_ms: 5000
    unit: —
    threshold_min: —
    threshold_max: —
    op_params:
      type: fixture
      signal: estop
      level: L
  - name: Sys_5V
    kind: Static Impedance
    enable: true
    wait_ms: 100
    timeout_ms: 5000
    unit: ohm
    threshold_min: '30'
    threshold_max: —
  - name: Power On DUT
    kind: op
    enable: true
    wait_ms: 100
    timeout_ms: 5000
    unit: —
    threshold_min: —
    threshold_max: —
    op_params:
      type: power
      voltage: 5.0
      current: 1.0
  - name: New Operation
    kind: op
    enable: true
    wait_ms: 100
    timeout_ms: 5000
    unit: —
    threshold_min: —
    threshold_max: —
  power_rails_up_sequence:
    instrument: Keysight U2355A analog input
    channels: 0
    duration_s: 6.0
    sample_rate_hz: 200
    judgment: record only - no pass/fail
    rails: []
  fct_test_cases:
  - name: ''
    kind: MessageOK
    enable: true
    wait_ms: 100
    timeout_ms: 5000
