  u2355a:
    title: U2355A
    fields:
      Model: Keysight U2355A USB DAQ
      Analog input: 16-bit, ±10 V, 250 kSa/s aggregate
      Counters: 2 x 0.1 Hz - 6 MHz
      Digital IO: 24 TTL channels
      AO (backup): 2 x 12-bit ±10 V
