fct_sequence:
  name: FRDM-IMXRT700 FCT - CLI flash path
  flash_mode: cli
  keyword_pass:
  - pass
  - passed
  - success
  - succeed
  - ok
  - done
  - complete
  keyword_fail:
  - fail
  - failed
  - failure
  - error
  - timeout
  - abort
  - exception
  - refused
  steps:
  - name: Flash FAT Firmware
    category: Console
    type: cli
    channel: ser1
    command: blhost -p COM5 flash-image fat.bin
    expect_pass:
    - success
    expect_fail:
    - fail
    - failed
    - failure
    - error
    - timeout
    - abort
    - exception
    - refused
    timeout_s: 30.0
    retries: 0
    on_fail: abort
    depends: []
    resource: operator
    params:
      slot: fat
  - name: Wi-Fi throughput iperf3
    category: Console
    type: serial
    channel: ser1
    command: iperf3 -c 192.168.1.1 -t 5
    expect_pass:
    - Mbits/sec
    expect_fail:
    - error
    - refused
    timeout_s: 30.0
    retries: 1
    on_fail: abort
    depends: []
    resource: console:ser1
    params:
      fct_console: true
      send: iperf3 -c 192.168.1.1 -t 5
      send_enabled: true
      capture_enabled: true
      expect_pass_re: Mbits/sec
      capture_is_expected: true
  - name: All Tests done.
    category: Message
    type: ok
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: ''
    params:
      message: All Tests done.
  - name: Flash OOBE Firmware
    category: Console
    type: cli
    channel: ser1
    command: blhost -p COM5 flash-image fat.bin
    expect_pass:
    - success
    expect_fail:
    - fail
    - failed
    - failure
    - error
    - timeout
    - abort
    - exception
    - refused
    timeout_s: 30.0
    retries: 0
    on_fail: abort
    depends: []
    resource: operator
    params:
      slot: oobe
  - name: Power Off DUT
    category: Operation
    type: power_off
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: ''
    params:
      op: Power Off DUT
  - name: Reset Instruments
    category: Operation
    type: reset_instruments
    channel: ''
    command: ''
    expect_pass: []
    expect_fail: []
    timeout_s: 0.0
    retries: 0
    on_fail: abort
    depends: []
    resource: ''
    params:
      op: Reset Instruments
