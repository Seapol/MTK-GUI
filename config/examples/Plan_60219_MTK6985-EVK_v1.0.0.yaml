yaml_build:
  plan_version: 1.0.0
  modules:
    design_input:
      product_id: '60219'
      part_number: MTK6985-EVK
      sw_version: 1.0.0
      hw_version: 1.0.0
      batch: R&R (Return&Rework)
      spf_file: spf/MTK6985-EVK.spf
      net_file: netlists/MTK6985-EVK.net
    parse_ict:
      netlist_file: netlists/MTK6985-EVK.net
    instruments:
      psu_visa: TCPIP0::192.168.1.25::inst0
      daq_visa: GPIB0::9::INSTR
      dmm_visa: ''
      channel_alloc: []
      self_test: true
    rails:
      on_voltage_v: 5.0
      current_limit_a: 2.0
      on_delay_ms: 100
      off_delay_ms: 200
      off_protection: true
      sequence:
      - VDD_3V3:0.1
      - VDD_1V8:0.2
      - VDD_5V:0.3
      voltage_tolerance_pct: 0.1
      impedance_min_ohm: 1.5
      sample_rate_hz: 1000
      pre_trigger_s: -0.5
      post_trigger_s: 6.0
      anomaly_policy: stop
    clocks:
      clocks:
      - CLK1:32768:2
      - CLK2:4000000:2
      stabilize_ms: 100
      drift_check: true
      multi_domain_check: false
    gpios:
      groups:
      - GPIO0:TP_G0.1:out:none
      - GPIO1:TP_G1.1:in:pullup
      level_threshold_v: 1.5
      exception_check: true
    programmer:
      protocol: SWD
      speed_khz: 4000
      timeout_ms: 30000
      flash_address: '0x0'
      retries: 1
      log_level: info
    peripherals:
      wifi_ssid: ''
      wifi_password: ''
      bt_mac: ''
      uart_baud: 115200
      i2c_addr: ''
      spi_speed_hz: ''
      adc_ref_v: ''
      init_sequence: []
    validate_sequence:
      resource_conflict_check: true
      param_range_check: true
      dependency_check: true
    preview_export:
      export_dir: config/plans
      include_disabled: false
    fct_build:
      flow_steps:
      - (FCT skipped - ICT-only plan)
      yield_threshold_pct: 98.0
      exception_branch: stop
      case_link: ''
      enabled: false
  design_data:
    net_file: netlists/MTK6985-EVK.net
    testable_nets:
      VDD_3V3:
        category: Power
        members:
        - TP_P1.1
      VDD_1V8:
        category: Power
        members:
        - TP_P2.1
      VDD_5V:
        category: Power
        members:
        - TP_P3.1
      CLK1_32K:
        category: Clock
        members:
        - TP_C1.1
      CLK2_4M:
        category: Clock
        members:
        - TP_C2.1
      GPIO0:
        category: GPIO
        members:
        - TP_G0.1
      GPIO1:
        category: GPIO
        members:
        - TP_G1.1
  channel_allocation:
    power:
    - net: VDD_3V3
      test_point: TP_P1.1
      impedance: 'DAQM908A #1 CH101'
      power_rails: U2355A AI01
      voltage: 'DAQM908A #2 CH201'
      se_clock_hz: —
      band: —
      digital_input: HighZ
      digital_output: No Output
    - net: VDD_1V8
      test_point: TP_P2.1
      impedance: 'DAQM908A #1 CH102'
      power_rails: U2355A AI02
      voltage: 'DAQM908A #2 CH202'
      se_clock_hz: —
      band: —
      digital_input: HighZ
      digital_output: No Output
    - net: VDD_5V
      test_point: TP_P3.1
      impedance: 'DAQM908A #1 CH103'
      power_rails: U2355A AI03
      voltage: 'DAQM908A #2 CH203'
      se_clock_hz: —
      band: —
      digital_input: HighZ
      digital_output: No Output
    clock:
    - net: CLK1_32K
      test_point: TP_C1.1
      impedance: —
      power_rails: —
      voltage: —
      se_clock_hz: DAQM907A TOT
      band: 0 ~ 100 kHz
      digital_input: HighZ
      digital_output: No Output
    - net: CLK2_4M
      test_point: TP_C2.1
      impedance: —
      power_rails: —
      voltage: —
      se_clock_hz: U2355A CTR0
      band: 0.1 Hz ~ 6 MHz
      digital_input: HighZ
      digital_output: No Output
    gpio:
    - net: GPIO0
      test_point: TP_G0.1
      impedance: —
      power_rails: —
      voltage: —
      se_clock_hz: —
      band: —
      dio_channel: DAQM907A DIO01
    - net: GPIO1
      test_point: TP_G1.1
      impedance: —
      power_rails: —
      voltage: —
      se_clock_hz: —
      band: —
      dio_channel: DAQM907A DIO02
plan:
  kind: final
  plan_version: 1.0.0
  core_id: '60219'
  part_number: MTK6985-EVK
  locked: true
  ict_only: true
