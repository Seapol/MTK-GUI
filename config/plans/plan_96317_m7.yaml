  - stage: FCT
    description: 'Functional Test: LED -> Serial Console (Linux) -> Wi-Fi -> Bluetooth -> Flash FAT -> Flash OOBE'
    enable: true
  stop_if_failure: false
  stop_if_any_short: true
  auto_sn: false
  retry: 0
