name: Build Windows exe

on:
  workflow_dispatch:      # manual run from the Actions tab
  push:
    tags: ['v*']          # e.g. v2.0.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller (spec bundles the config folder)
        run: pyinstaller --noconfirm MTK_GUI_windows.spec

      - name: Pack distributable zip
        shell: pwsh
        run: Compress-Archive -Path 'dist\MTK_GUI' -DestinationPath 'dist\MTK_GUI_win64.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTK_GUI_win64
          path: dist/MTK_GUI_win64.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTK_GUI_win64.zip
